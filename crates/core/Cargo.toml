[package]
name = "player-core"
description = "Platform-agnostic player logic: state, queue, playlist, library, settings"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
thiserror.workspace = true
toml.workspace = true
rusqlite.workspace = true
lofty = "0.22"
md5 = "0.7"
serde_json.workspace = true
ureq = { version = "2", default-features = false, features = ["tls", "gzip", "json"] }
symphonia = { version = "0.5", default-features = false, features = ["mp3", "isomp4", "aac", "wav", "flac", "ogg", "vorbis", "pcm"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[lints]
workspace = true
