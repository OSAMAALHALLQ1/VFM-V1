[workspace]
resolver = "3"
members = ["crates/vlc-wrapper", "crates/core", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.dependencies]
vlc-wrapper = { path = "crates/vlc-wrapper" }
player-core = { path = "crates/core" }
libloading = "0.9"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = "1.19"
slint-build = "1.19"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.release]
debug = "line-tables-only"
